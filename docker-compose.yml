services:
  chatlume:
    build: .
    restart: unless-stopped
    volumes:
      - whatsview_data:/data
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  whatsview_data:
